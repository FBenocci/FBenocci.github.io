# Regenerates the publication list from publications.bib and deploys the site to GitHub Pages.
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build publication list
        run: python build_pubs.py
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html 404.html style.css main.js favicon.svg assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
